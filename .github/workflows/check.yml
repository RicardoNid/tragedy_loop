name: Scaffold configuration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --python 3.12 --default-index https://pypi.org/simple
      - run: pnpm check
      - name: Verify portable facts reader
        run: |
          python3 facts/tools/verify_wiki.py
          python3 facts/tools/verify_reader_feedback.py
          python3 facts/tools/verify_reader_v3.py
          python3 facts/tools/verify_portability.py
          node --check facts/assets/wiki.js
