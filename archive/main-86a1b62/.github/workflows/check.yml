name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - run: npm run setup
      - run: npm run check
      - name: Install test browser
        working-directory: integrations/lunhui/lunhui-engine
        run: pnpm exec playwright install --with-deps chromium
      - run: npm run engine:gui:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-evidence
          path: |
            integrations/lunhui/lunhui-engine/playwright-report/
            integrations/lunhui/lunhui-engine/test-results/
