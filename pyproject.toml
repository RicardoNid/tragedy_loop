[project]
name = "tragedy-tools"
version = "0.1.0"
description = "Python auxiliary environment for Tragedy Loop; implementation pending."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["archive", "facts", ".venv", "node_modules"]
