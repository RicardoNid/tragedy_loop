<th>来源规则</th>

<tbody>
<tr>

<tr>
<td>主谋</td>

</tr>
<tr>
<td>邪教徒</td>
<td>必定无视友好</td>
<td>任意能力：行动结算阶段，可以无效化同一区域中任意角色身上和该角色所在版图上放置的禁止密谋。</td>

</tr>
<tr>
<td>忍者</td>
<td>无视友好</td>

<h2 id="midnight-zone%E4%BA%8B%E4%BB%B6">Midnight Zone：事件</h2>
<table>
<thead>
<tr>
<th>事件名</th>
<th>事件效果</th>
</tr>
</thead>
<tbody>
<tr>
<td>连续杀人</td>
<td>与当事人位于同一区域的另外 1 名角色死亡。1 名角色可以同时担任多个连续杀人事件的当事人。</td>
</tr>
<tr>
<td>自杀</td>
<td>当事人死亡。</td>
</tr>
<tr>
<td>不安扩散</td>
<td>往任意 1 名角色身上放置 2 枚「不安」，随后往另外 1 名角色身上放置 1 枚「密谋」。</td>
</tr>
<tr>
<td>失踪</td>
<td>将当事人移动至任意版图。随后，往当事人所在版图放置 1 枚「密谋」。</td>
</tr>
<tr>
<td>阴谋活动</td>
<td>通过密谋指示物数量判定是否发生，结算连续杀人或失踪事件的效果。</td>
</tr>
<tr>
<td>医院事故</td>
<td>医院有 1 枚或以上「密谋」时，位于医院的所有角色死亡。医院有 2 枚或以上「密谋」时，主人公死亡。</td>
</tr>
<tr>
<td>暴乱</td>
<td>学校有 1 枚或以上「密谋」时，位于学校的所有角色死亡。都市有 1 枚或以上「密谋」时，位于都市的所有角色死亡。</td>
</tr>
<tr>
<td>自白</td>
<td>当事人公开自己的身份。</td>
</tr>
<tr>
<td>破局</td>
<td>由队长选择 1 名角色或 1 块版图，移除其 2 枚「密谋」。</td>
</tr>
<tr>
<td>伪装自杀</td>
<td>往当事人身上放置 1 张 Ex 牌。本轮轮回剩余时间，主人公无法往放置了 Ex 牌的角色身上放置行动牌。</td>
</tr>
<tr>
<td>伪造事件</td>
<td>当事人初始区域有 2 枚或以上「密谋」时，主人公死亡。将伪造事件记入公开信息表时，可以自由命名事件名称；非公开信息表和游戏中依然视为伪造事件。</td>
</tr>
</tbody>
</table>

<h3 id="%E6%B8%B8%E6%88%8F%E5%AE%9A%E4%BD%8D">游戏定位</h3>
<ul>
<li><code>惨剧轮回</code> 是 2-4 人非对称剧本推理桌游。</li>
<li>1 名玩家担任 <code>剧作家</code>，掌握剧本真相并推动惨剧发生。</li>
<li>1-3 名玩家担任 <code>主人公</code>，通过多次轮回积累线索，阻止惨剧或在最终决战中识破真相。</li>
</ul>

<h3 id="%E8%83%9C%E5%88%A9%E6%9D%A1%E4%BB%B6-1">胜利条件</h3>
<ul>
<li>主人公在任意一轮轮回结束时，若没有达成失败条件且主人公没有死亡，则主人公获胜。</li>
<li>若所有轮回都失败，主人公进入最终决战。</li>
<li>最终决战中，主人公需要逐一猜出所有角色身份；猜错 1 个或以上则剧作家获胜，全部正确则主人公获胜。</li>
<li>剧作家需要让主人公在每一轮都失败，并避免最终决战被完全识破。</li>
</ul>

<h3 id="%E8%88%9E%E5%8F%B0%E4%B8%8E%E8%A7%92%E8%89%B2-1">舞台与角色</h3>
<ul>
<li>常用区域：医院、神社、都市、学校。</li>
<li>每名角色以角色牌表示，放在某个区域上。</li>
<li>角色生存时竖置，死亡时横置。</li>
<li>死亡角色视为尸体，不能再使用友好能力或角色特性，但其身上的指示物不清空。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 005</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="26" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E8%A7%92%E8%89%B2%E7%89%8C%E9%9C%80%E8%A6%81%E8%AF%BB%E6%87%82%E7%9A%84%E9%A1%B9%E7%9B%AE">角色牌需要读懂的项目</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：36-43</p></div>
<h3 id="%E8%A7%92%E8%89%B2%E7%89%8C%E9%9C%80%E8%A6%81%E8%AF%BB%E6%87%82%E7%9A%84%E9%A1%B9%E7%9B%AE-1">角色牌需要读懂的项目</h3>
<ul>
<li>卡牌名：角色名称。</li>
<li>不安限度：不安指示物达到或超过该值时，该角色可能触发事件。</li>
<li>初始区域/禁行区域：轮回开始时的位置，以及不能前往的位置。</li>
<li>属性：角色类型，按规则或剧本需要参考。</li>
<li>友好能力/角色特性：主人公通过放置友好指示物达到门槛后，可以声明使用友好能力。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 006</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="27" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E4%B8%89%E7%B1%BB%E6%A0%B8%E5%BF%83%E6%8C%87%E7%A4%BA%E7%89%A9">三类核心指示物</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：44-49</p></div>
<h3 id="%E4%B8%89%E7%B1%BB%E6%A0%B8%E5%BF%83%E6%8C%87%E7%A4%BA%E7%89%A9-1">三类核心指示物</h3>
<ul>
<li>友好指示物：代表角色与主人公的关系。主人公通过行动牌放置，达到门槛后可使用友好能力。</li>
<li>不安指示物：代表角色心理状态。主人公和剧作家都可能放置；事件通常需要当事人的不安达到门槛才会发生。</li>
<li>密谋指示物：代表剧作家的阴谋。通常由剧作家放置在角色或版图上；可能导致失败条件、身份能力或角色死亡。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 007</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="28" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E8%BD%AE%E5%9B%9E%E5%87%86%E5%A4%87">轮回准备</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：50-58</p></div>
<h3 id="%E8%BD%AE%E5%9B%9E%E5%87%86%E5%A4%87-1">轮回准备</h3>
<p>每轮轮回开始前按顺序处理：</p>
<ol>
<li>时之缝隙：主人公讨论；若全员达成共识，可选择直接进入最终决战。</li>
<li>配置角色：剧作家把登场角色放到初始区域。</li>
<li>移除及配置指示物：移除卡牌和版图上的指示物，再配置轮回开始时需要的指示物。</li>
<li>分发手牌：按初始手牌给每位玩家发行动牌。</li>
</ol>
<div class="source-tag">基础教学 / 结构化整理稿 | 008</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="hand-layout" data-theme="default" lang="C" class="hand-layout" data-marpit-pagination="29" style="--paginate:true;--class:hand-layout;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E5%88%9D%E5%A7%8B%E6%89%8B%E7%89%8C">初始手牌</h2>
<p class="note">初始手牌分为主人公手牌与剧作家手牌；此页为版式化审阅稿。</p>
<div class="hand-grid">

<li>禁止密谋</li>
</ul>
</div>

<li>移动左右</li>
<li>斜向移动</li>
<li>禁止友好</li>
<li>不安 +1</li>
<li>不安 +1</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="30" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E6%AF%8F%E5%A4%A9%E6%AF%8F%E5%9B%9E%E5%90%88%E6%B5%81%E7%A8%8B">每天/每回合流程</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：85-106</p></div>
<h3 id="%E6%AF%8F%E5%A4%A9%E6%AF%8F%E5%9B%9E%E5%90%88%E6%B5%81%E7%A8%8B-1">每天/每回合流程</h3>
<p>每一天按 9 个阶段进行：</p>
<ol>
<li>回合开始阶段</li>
<li>剧作家行动阶段</li>
<li>主人公行动阶段</li>
<li>行动结算阶段</li>
<li>剧作家能力阶段</li>
<li>主人公能力阶段</li>
<li>事件阶段</li>
<li>队长轮换阶段</li>
<li>回合结束阶段</li>
</ol>
<p>新人先记住：</p>
<ul>
<li>剧作家每回合暗置 3 张行动牌。</li>
<li>主人公从队长开始，每位暗置 1 张行动牌。</li>
<li>同一名角色或同一块版图不能被同一阵营重复放置。</li>
<li>行动牌同时翻开，先处理移动，再处理其它效果。</li>
<li><code>每轮限 1 次</code> 的牌用过后本轮不能再用。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 010</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="31" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E4%BA%8B%E4%BB%B6%E5%A6%82%E4%BD%95%E5%8F%91%E7%94%9F">事件如何发生</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：107-118</p></div>
<h3 id="%E4%BA%8B%E4%BB%B6%E5%A6%82%E4%BD%95%E5%8F%91%E7%94%9F-1">事件如何发生</h3>
<p>事件阶段中，如果当天有预定事件，剧作家判断事件是否发生。</p>
<p>事件通常需要同时满足：</p>
<ul>
<li>事件当事人存活。</li>
<li>当事人身上的不安指示物达到或超过不安限度。</li>
<li>剧本或事件本身要求的其它条件满足。</li>
</ul>
<p>剧作家只需要公开事件是否发生以及结果，不需要说明背后的完整原因。</p>
<div class="source-tag">基础教学 / 结构化整理稿 | 011</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="32" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E5%89%A7%E4%BD%9C%E5%AE%B6%E5%A6%82%E4%BD%95%E8%A1%A8%E8%BE%BE%E7%BB%93%E7%AE%97">剧作家如何表达结算</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：119-128</p></div>
<h3 id="%E5%89%A7%E4%BD%9C%E5%AE%B6%E5%A6%82%E4%BD%95%E8%A1%A8%E8%BE%BE%E7%BB%93%E7%AE%97-1">剧作家如何表达结算</h3>
<p>剧作家不需要公开隐藏身份、规则或能力的真实来源。示例表达：</p>
<ul>
<li>“1 枚密谋指示物出现在巫女身上。”</li>
<li>“你们死了。”</li>
<li>“轮回结束时，你们失败了。”</li>
</ul>
<p>主人公需要从这些结果中反推原因。</p>
<div class="source-tag">基础教学 / 结构化整理稿 | 012</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="33" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E8%BD%AE%E5%9B%9E%E7%BB%93%E6%9D%9F">轮回结束</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：129-142</p></div>
<h3 id="%E8%BD%AE%E5%9B%9E%E7%BB%93%E6%9D%9F-1">轮回结束</h3>
<p>轮回结束条件：</p>
<ul>
<li>最终日回合结束。</li>
<li>某些效果导致轮回结束。</li>
<li>主人公死亡。</li>
</ul>
<p>轮回结束后：</p>
<ul>
<li>若没有达成失败条件，主人公胜利。</li>
<li>若达成失败条件且不是最终轮回，进入下一轮。</li>
<li>若达成失败条件且已经是最终轮回，进入最终决战。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 013</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="34" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="%E6%9C%80%E7%BB%88%E5%86%B3%E6%88%98">最终决战</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：143-150</p></div>
<h3 id="%E6%9C%80%E7%BB%88%E5%86%B3%E6%88%98-1">最终决战</h3>
<ol>
<li>复原盘面到轮回开始状态。</li>
<li>主人公选择角色并声明其身份。</li>
<li>剧作家逐一判定。</li>
<li>猜错任意 1 个：剧作家获胜。</li>
<li>全部猜对：主人公获胜。</li>
</ol>
<div class="source-tag">基础教学 / 结构化整理稿 | 014</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="structured" data-theme="default" lang="C" class="structured" data-marpit-pagination="35" style="--paginate:true;--class:structured;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<h2 id="%E7%AC%AC%E4%BA%8C%E9%83%A8%E5%88%86%E8%A1%A5%E5%85%85%E8%B5%84%E6%96%99%E9%9D%9E%E5%BC%80%E5%B1%80%E5%BF%85%E8%AE%B2-1">第二部分：补充资料，非开局必讲</h2>
<h3 id="%E5%AE%8C%E6%95%B4%E8%A7%92%E8%89%B2%E5%8F%8B%E5%A5%BD%E8%83%BD%E5%8A%9B%E6%B8%85%E5%8D%95">完整角色友好能力清单</h3>
<p>基础教学后半部分列出了基础包角色的友好能力和特性。它适合查阅，不适合在新手开局前全部讲解。</p>
<p>Slides 中只保留：</p>
<ul>
<li>友好能力的使用条件。</li>
<li>能力由队长声明使用。</li>
<li>剧作家只能在角色具备“无视友好”或“必定无视友好”时拒绝。</li>
<li>每个可用能力每轮通常只能使用一次；标注“每轮限 1 次”的能力用后不可再用。</li>
</ul>

<h3 id="%E8%A1%8C%E5%8A%A8%E7%89%8C%E7%BB%86%E5%88%99-1">行动牌细则</h3>
<p>基础教学中列出了主人公和剧作家的行动牌细则。新手剧本只需要重点理解：</p>
<ul>
<li>移动上下/移动左右/斜向移动。</li>
<li>禁止移动。</li>
<li>友好 +1 / 友好 +2 / 禁止友好。</li>
<li>不安 +1 / 不安 -1 / 禁止不安。</li>
<li>密谋 +1 / 密谋 +2 / 禁止密谋。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 016</div>

<h2 id="%E5%89%A7%E6%9C%AC%E4%B8%8E%E6%83%A8%E5%89%A7%E6%A8%A1%E5%9D%97">剧本与惨剧模块</h2>
<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：174-179</p></div>
<h3 id="%E5%89%A7%E6%9C%AC%E4%B8%8E%E6%83%A8%E5%89%A7%E6%A8%A1%E5%9D%97-1">剧本与惨剧模块</h3>
<ul>
<li>公开信息表：主人公开局就能看到，包括惨剧模块、轮回次数、每轮天数、是否允许讨论、特殊规则、预定事件。</li>
<li>非公开信息表：只有剧作家掌握，包括规则、角色身份、事件当事人等真相。</li>
<li>惨剧模块：剧本可用规则、身份和事件的素材库，也是主人公推理的边界。</li>
</ul>
<div class="source-tag">基础教学 / 结构化整理稿 | 017</div>

<div class="review-note"><h3>审阅提示</h3><p>这里是整理后的结构稿。请检查术语、遗漏、剧透边界和表格含义。</p><p>来源行：180-186</p></div>
<h2 id="%E5%BE%85%E6%A0%A1%E5%AF%B9%E9%A1%B9-1">待校对项</h2>

<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-001the-the">OCR 原文审阅 001｜THE THE</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：001</p><p>源文件行：1-6</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># THE THE
<p>歡迎来到『慘劇輪迴』的世界!本作是一款供2至4名玩家遊玩的劇本型推理桌遊。其中1 名玩家需擔當「劇作家」,負責創造慘劇的舞台。剩下的1至3名玩家擔當「主人公」,向慘劇 發起挑戰。</p>
<p>關於世界觀,相信各位已經通過剛才的短漫了解了其中一部分:利用回溯時間的能力来對抗毫無破綻的慘劇。沒錯,這款遊戲能夠讓你親身體驗「時間輪迴」的概念。現在的你腦海中浮現了誰呢?就是這樣哦,如今,你也能夠像你想像中的他或她那樣,開啟這扇時空之門,害寫只屬於自己的篇章!</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="62" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-002%E5%AF%AB%E7%B5%A6%E5%88%9D%E6%AC%A1%E9%81%8A%E7%8E%A9%E7%9A%84%E7%8E%A9%E5%AE%B6">OCR 原文审阅 002｜寫給初次遊玩的玩家</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：002</p><p>源文件行：7-14</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 寫給初次遊玩的玩家
<p>首先從你們當中選出一位擔任劇作家的玩家吧。如果某位玩家曾有過遊玩本遊戲的經驗,那就由他擔任劇作家來引領遊戲吧。如果大家都是初次體驗,那便讓最熟悉桌遊或者 TRPG 的玩家來擔任劇作家吧。</p>
<p>擔任劇作家的玩家從『劇作家之書』的第 2 頁開始閱讀,按照所寫的對劇作家的要求, 進行遊戲並引導主人公吧。</p>
<p>其餘成為主人公的玩家,首先請閱讀下文「主人公玩家的目的」。接著,請隨著劇作家的引導進行遊戲。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="63" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：003</p><p>源文件行：15-20</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">### 主人公玩家的目的
<ul>
<li>Period</li>
</ul>
<p>你們的目的是打破這場慘劇,抓住幸福的未來。但是,對於慘劇的內際們不知情:無論是角色的身份,隱不知情:無論是角色的身份,隱是勝利的條件。不過是勝利的條件。不經不過是勝利的條件。可以重複 1 次、2 次、甚至 3 次。甚至 3 次、甚至 3 次、甚至 3 次、甚至 3 次、改改则,应则则,遂慰的规则或不会改为,而你們的經驗卻會逐漸積累。並且,不能夠不可以能夠獲得勝利。如果,你們就是挑戰者,將其徹底打破吧!</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="64" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-004%E5%B7%B2%E7%B6%93%E5%AE%8C%E6%88%90%E4%BA%86%E7%AC%AC%E4%B8%80%E5%A0%B4%E9%81%8A%E6%88%B2">OCR 原文审阅 004｜已經完成了第一場遊戲?</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：004</p><p>源文件行：21-30</p><p>推定页码：1</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">#### 已經完成了第一場遊戲?
<p>讓我們來挑戰 更高難度的劇本吧!</p>
<p>『劇作家之書』中一共收錄了10份劇本。</p>
<p>無論這些劇本多麼兇險, 我們絕不會屈服!</p>
<p>[图片占位: _page_0_Picture_15.jpeg]</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="65" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-005%E9%81%8A%E6%88%B2%E7%B5%84%E4%BB%B6">OCR 原文审阅 005｜遊戲組件</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：005</p><p>源文件行：31-50</p><p>推定页码：2</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 遊戲組件
<p>现在,我們先来觀摩一下慘劇的舞台吧。 讓我們首先對遊戲做一個概述,介紹一下遊戲中出現的組件。</p>
<h3 id="%E7%89%88-%E5%9C%96-5-%E5%A1%8A">版-圖-(5-塊-)</h3>
<p>[图片占位: _page_1_Picture_5.jpeg]</p>
<p>整個故事以醫院、神社、都市、學校這 4處為中心展開。4塊版圖分別對應上述4 個位置。每塊版圖對應的地方稱為一個區域。</p>
<p>主人公也將在這個舞台上登場。然而, 作為故事主角的你們並不會在這些版圖上以 卡牌或者棋子的形式出現。</p>
<p>左側的版圖是數據記錄板。用於管理各種數據,例如當前的輪迴次數等。</p>
<p>[图片占位: _page_1_Figure_9.jpeg]</p>
<p>通過將角色卡牌放置在某一塊版圖上,來表示他正位於那個區域。如圖示的情況表示男學生正位於都市。</p>
<p>當然,只憑你們無法搭建出慘劇的舞台。在這些故事中,還會有別的登場角色。劇作家會從諸如男學生、女學生、巫女、職員等各種特色鮮明的人物中,選出其中幾名加入這個舞台。每名角色由一張對應的角色牌來表示,下面來具體介紹該如何識別角色牌。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="66" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-006%E8%A7%92%E8%89%B2%E7%89%8C24-%E5%BC%B5">OCR 原文审阅 006｜角色牌(24-張)</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：006</p><p>源文件行：51-62</p><p>推定页码：3</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">### 角色牌(24-張)
<p>[图片占位: _page_2_Picture_3.jpeg]</p>
<p>這些角色就是所謂的 NPC (Non-Player Character)。他/她們各自擁有重要的能力,如果能和他/她們構築起友好關係,則能夠給予你們幫助。比如情報商能夠通過能力,告知你們尚未了解的隱藏情報。</p>
<p>而且,他/她們的任務遠不僅限於此。 除了卡面上明文描述的能力之外,這些 角色還可能各有一個隱藏的身份。也許 面前的女孩,是一旦死亡就會成為破 導人物,看似純真的男孩, 卻有可能是謀劃慘劇的主謀;那個 裡不太起眼的傢伙,竟然是遏制不住殺 人衝動的殺人狂。這些情報在遊戲開始 時,你們一無所知。但是,只要不 經歷輪迴,你們就能夠逐步解開這一個 又一個的謎题。</p>
<p>[图片占位: _page_2_Picture_6.jpeg]</p>
<p>[图片占位: _page_2_Picture_7.jpeg]</pre></div></p>

<p>代表角色的類型。可以根據實際需要進行參考。</p>
<h4 id="%E2%91%A4%E5%8F%8B%E5%A5%BD%E8%83%BD%E5%8A%9B%E8%A7%92%E8%89%B2%E7%89%B9%E6%80%A7">⑤友好能力/角色特性</h4>
<p>可以通過角色的友好能力來幫助主人公玩家推進遊戲。當角色身上的友好指示物數量等同或超過某能力標記的數量,主人公玩家就可以使用這項能力。 使用能力後不會導致友好指示物減少。註明「每輸限1次」的能力,在1輪軸迴中只能使用1次。</p>
<p>角色特性則體現了部分角色與眾不同的特色。劇作 家會按照實際需要進行處理。</pre></div></p>
</section>

<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-010">OCR 原文审阅 010｜· · · · · · · · · · · · · · · · · · ·</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：010</p><p>源文件行：85-90</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># · · · · · · · · · · · · · · · · · · ·
<p>遊戲時,通過擺放在版圖上的朝向來表示角色的生死。角色生存時在版圖上豎置,死亡則橫置。</p>
<p>死亡的角色牌不再視作某名角色,而是視作 屍體。因此無法繼續使用其友好能力或者角色特 性。另一方面,角色死亡並不會清空其當前帶有 的各類指示物。 有了版圖和角色,整個盤面就湊齊了。那麼,你們在這個舞台上要做些什麼?接下來要介紹的就是行動牌。你們通過它,可以對角色和版圖加以干涉。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="71" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<p>[图片占位: _page_3_Picture_6.jpeg]</p>
<p>在遊戲中,你們絕大多數的行為 是對角色和版圖打出行動牌。所有人 需要背面朝上打出行動牌,然後一起 翻面結算效果。</p>
<p>請注意,能打出行動牌的人不只有你們。劇作家也有一套獨特的行動牌,並且會通過那些牌將你們卷入慘劇的深淵。</p>
<p>行動牌舉例</p>
<p>移動系</p>
<p>為了更容易判斷是誰出的牌, 遊戲共設計了4種不同的卡背。 請玩家們分別使用不同卡背的行動牌。</p>
<p>密謀系</p>
<p>讓場上角色移動至其它區域的 卡牌,也有阻止其移動的卡牌。</p>
<p>通過增加友好指示物來和角色結 下友誼的卡牌,也有阻止主人公 與角色結下友誼的卡牌。</p>
<p>不安系</p>
<p>[图片占位: _page_3_Picture_16.jpeg]</p>
<p>※ 詳細效果請參閱第 42、43 頁的手牌清單。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="72" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：012</p><p>源文件行：117-128</p><p>推定页码：5</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">通過增加密謀指示物,在角色或各個版圖籌劃陰謀的卡牌,也有阻止 劇作家籌劃陰謀的卡牌。 通過使用這些行動牌,可以改變場上角色的狀態。
<p>角色狀態的改變會通過其卡牌上指示物的增減來表現。接下來介紹這些指示物。</p>
<h1 id="%E6%8C%87%E7%A4%BA%E7%89%A9-94-%E6%9E%9A">指示物 (94 枚)</h1>
<p>每位角色都有多種狀態。可能對你們主人公一行抱有善意,也有可能正在被負面的情緒所困擾。為了表現這些狀態,遊戲準備了3種不同的指示物。此外還有一些其它的指示物,那些特殊的指示物能夠讓遊戲的進行狀況更加一目了然。</p>
<p>[图片占位: _page_4_Picture_6.jpeg]</p>
<p>[图片占位: _page_4_Picture_7.jpeg]</pre></div></p>

<p>本節將說明主人公和劇作家雙方的勝利條件。</p>

<ul>
<li>•在某一輪輪迴結束時,未滿足以下條件。
<ul>
<li>達成失敗條件。</li>
<li>自己(主人公)死亡。</li>
</ul>
</li>
<li>·在最終決戰(參照§6)中勝出。</pre></div></li>
</ul>
</section>

<p>·在所有的輪迴中均取得勝利(導致主人 公達成失敗條件或者殺害主人公),並 且未在最終決戰(參照§6)中失敗。</p>
<p>這裡所說的失敗條件,由劇本使用的規則 以及加入遊戲的各種身份所決定。比如規則 Y 是被封印的邪靈,在輪迴結束時,若神社放置 了 2 枚或以上的密謀指示物,則主人公失敗。</pre></div></p>
</section>

<p>通過某些身份能力或者規則,可能會 導致主人公死亡。例如,殺手能夠使用其 能力殺害主人公。若主人公死亡,劇作家 需將此信息傳達給主人公玩家,本輪迴主 人公失敗並且輪迴立即結束。</p>

<p>劇作家需準備本局遊戲所使用的劇本。『劇作家之書』中一共收錄了10份劇本,如有必要, 劇作家也可以自製劇本。</p>

<p>劇作家向主人公玩家公示當前所選劇本的 「公開信息表」。</p>
<p>每份劇本都由「公開信息表」和「非公開信息表」組成。「非公開信息表」寫明了劇本的全部真相,而「公開信息表」僅提供主人公在遊戲開始時可以知曉的部分信息。詳情參考第 26 頁。</pre></div></p>

<p>本節將說明每一輪輪迴開始前所需的準備。 隨後,我們將在§4說明輪迴的推進方式,§5 說明輪迴結束時的處理方式。通過這三節,能 夠理解遊戲整體如何推進。</p>
<p>在整場遊戲中,輪迴會重複多次,而其具體次數根據劇本來決定。如果劇本共計會進行3輪迴,則玩家從第1輪軸迴開始,本輪迴失敗則進入第2輪輪迴,繼續失敗則進入最終輪迴。但是,一旦途中某輪輪迴主人公玩家取得了勝利,則不再進入後續的輪迴,主人公玩家獲得遊戲的勝利並且結束遊戲。</p>
<p>在輪迴開始前,按照下列順序進行準備。</p>
<ul>
<li>1時之縫隙</li>
<li>2配置角色</li>
<li>3 移除及配置指示物</li>
<li>4 分發手牌</pre></div></li>
</ul>
</section>

<p>主人公可以在這段時間中進行討論。如果 劇本規定了不准討論,那麼主人公玩家只允許 在這段時間中自由發言。討論時間由劇作家決 定,一般推薦留出 10 分鐘左右的時間。</p>
<p>此時,主人公亦可以選擇跳過之後所有輪</p>
<p>迴,直接進入最終決戰環節(後 文詳述)。進入最終決戰會自動 失去繼續輪迴的權利,因此這一 行動對主人公不利。當主人公已 經有了十足的把握,無需進行後 續輪迴也能夠揭開事實的真相時, 就採取這一行動吧。</pre></div></p>
</section>

<p>劇作家將登場角色以生存狀態配置在版圖 上。具體設置在哪塊版圖由角色牌上所記載的 初始區域決定。</p>

<p>本節將說明各輪迴該如何推進。每輪輪迴都包括數個回合,回合數即為天數,由各個劇本事先確定。從第1天、第2天……直至最終日。另外,每回合均可以細分為9個階段。階段順序如下所示。</p>
<p>(1) [10] (1) (1) (1)</p>
<ul>
<li>1回合開始階段[劇作家]</li>
<li>2 劇作家行動階段 [劇作家]</li>
<li>3 主人公行動階段 [主人公]</li>
<li>4 行動結算階段[劇作家]</li>

<p>放置卡牌時,主人公不可以將自己的卡牌 豐放於別的主人公玩家已放置卡牌的位置。不 過,可以將自己的卡牌疊放於劇作家已放置卡 牌的位置。</p>

<p>在這個階段,可能會發生劇本設定好的事件。如果這一天沒有預定任何事件,什麼都不做,本階段結束。</p>
<p>一旦事先預定過事件,則劇作家需要判定 事件是否發生,並將判定結果告知主人公玩家 (此時無需特別描述事件將如何處理)。當確 認事件發生後,開始處理其效果。</p>
<p>滿足下列所有條件時,事件發生。另外,如果某個事件需要指定對象,原則上均由劇作家指定。</p>
<ul>
<li>・事件當事人對應的角色當前存活。</li>

<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-044%C2%A75-%E8%BC%AA%E8%BF%B4%E7%B5%90%E6%9D%9F">OCR 原文审阅 044｜§5 輪迴結束</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：044</p><p>源文件行：429-444</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># §5 輪迴結束
<p>本節將說明各輪迴結束時需要進行的處理以及遊戲勝負的判定方法。</p>
<p>首先,當滿足下列任意1個條件時,輸迴 結束。</p>
<ul>
<li>最終日的回合結束階段已結束。</li>
<li>由於某些效果導致輪迴結束。</li>
<li>主人公死亡。</li>
</ul>
<p>在輪迴結束後,將進行勝負判定。此時, 劇作家需確認是否達成了主人公的失敗條件。 如果沒有達成任何失敗條件,則遊戲結束,主 人公取得遊戲的勝利。你們成功抓住了幸福的 未來,祝賀你們。</p>
<p>一旦達成某個失敗條件,那麼需要判斷當前輪迴是否已經是最後一輪輪迴。如果不是,那麼將輪迴指示物向下移動一格。接著參考,§3,重新開始新的一輪輪迴。嗚嗚嗚嗚嗚,這次又失敗了。</p>
<p>如果達成了失敗條件,並且當前已經是最後 一輪輪迴,那麼就會進入最終決戰。請參考§6。</pre></div></p>
</section>

<p>主人公任選一名角色,推理其身份並聲明。 劇作家將判定這個結論是否準確。如果結論準 確,主人公可以選擇下一名尚未聲明的角色, 並繼續進行推理。一旦推理錯誤,則最終決戰 立即結束,遊戲的勝利將屬於劇作家。</p>
<p>不斷重複上述操作,只要能夠準確推理出 所有角色的身份,則遊戲的勝利屬於主人公。 這場慘劇的真相,最終水落石出!</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="110" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：050</p><p>源文件行：485-492</p><p>推定页码：12</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 2或3名玩家遊玩本作時
<p>如果只有一位主人公玩家,這位主人公將擁有3套手牌,操作所有3位主人公的行動。 為了便於處理,可以僅保留「每輪限1次」的 手牌,其它的各種結算通過口頭交流來進行。</p>
<p>如果有兩位主人公玩家,則先由隊長行動, 接著另一位玩家通過兩套手牌行動兩次。和通 常遊戲一樣,隊長每回合都會輪換。</p>
<p>[图片占位: _page_11_Figure_14.jpeg]</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="111" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-051%E4%BB%80%E9%BA%BC%E6%98%AF%E5%8A%87%E6%9C%AC">OCR 原文审阅 051｜什麼是劇本?</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：051</p><p>源文件行：493-502</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 什麼是劇本?
<p>這一章將通過主人公的視角來解說什麼 是劇本。劇本記載了你們面對的這場慘劇的真 相。透過剛才的講解,相信你們一定有了初步 的認識。現在我們再來看一看,作為遊戲時的 主要規則,劇本到底起到了何種作用。</p>
<p>劇本中囊括了只有劇作家才了解的信息,保證了整場遊戲的準確性。在這款遊戲中,許多信息在遊戲開始時只有劇作家才了解。打個比方,版圖上的巫女其實是關鍵人物,她一死會導致整個村莊陷入滅頂之災……諸如此類的信息只有劇作家才知道。而主人公僅會在該條情報公開後才會得知這個真相。(往往是在巫女死亡導致遊戲失敗後)。</p>
<p>在這種信息不對稱的情況下,如果沒有任何保證措施,劇作家就可能說謊(或者臨場發揮),導致遊戲變得不公且無趣。因此,在劇本中寫明「巫女:關鍵人物」的話,遊戲結束時將其展示給主人公看,就能證明其準確性,雙方玩家建立起互相的信賴,能夠更容易一起享受遊戲的樂趣。</p>
<p>為了便於理解劇本中會記錄的內容,這裡向大家展示一份公開信息表和非公開信息表的示例(如果需要更大的圖片,請參閱第 46 到第 47 頁)。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="112" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">

<p>寫明了所使用的慘劇模組、輪迴次數以及每輪輪迴持續的天數、是否准許討論、劇作家規定的特殊規則和預定事件。主人公在遊戲開始時便掌握這些信息。</pre></div></p>

<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：053</p><p>源文件行：511-520</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 什麼是慘劇模組?
<p>慘劇模組相當於劇本的素材庫。規則Y、規 則X、身份、事件組成一個模組,而劇作家通 過這個模組來製作劇本。說得具體一些,「選 擇規則」「追加身份,並分配給每名角色」「選 擇事件,並決定發生日和當事人」這些內容均 不得超過模組給定的範圍。</p>
<p>而主人公也將基於慘劇模組進行推理。慘 劇模組的所有內容均對所有玩家公開。主人公</p>
<p>需要將遊戲中自己的各種經歷和體驗與模組的 內容進行比對,從而逐步推理劇本用的是哪條 規則,每名角色被分配到了哪種身份。</p>
<p>一套標準的慘劇模組會包括 5 條規則 Y. 7 條規則 X, 大約 12 種身份和 9 種事件。慘劇模 組的內容將對遊戲的內容產生十分巨大的影響。 當逐步熟悉遊戲內容後,不妨再去挑戰一下擴 展集裡新的慘劇模組吧。</pre></div></p>
</section>

<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：062</p><p>源文件行：595-620</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text"># 慘劇模組及卡牌等內容中特定詞彙的說明
<p>角色</p>
<p>指代處於生存狀態的角色牌。</p>
<p>屍體</p>
<p>指代處於死亡狀態的角色牌。</p>
<p>卡牌</p>
<p>無關生死,結合上下文指代某張角色牌。</p>
<p>學生、少女等等</p>
<p>指代擁有此類屬性,且處於生存狀態的角 色牌。但在製作劇本時,單純指代角色牌。</p>
<p>~ 死亡</p>
<p>指代角色牌從生存狀態轉變為死亡狀態。 當主人公死亡時,根據遊戲規則,以主人公失 敗結束本輪輪迴。此時需告知主人公死亡的這 一事實。</p>
<p>~ 復活</p>
<p>指代角色牌從死亡狀態轉變為生存狀態。</pre></div></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="123" data-paginate="true" data-class="ocr-review" data-theme="default" lang="C" class="ocr-review" data-marpit-pagination="123" style="--paginate:true;--class:ocr-review;--theme:default;" data-marpit-pagination-total="297" data-size="16:9">
<h2 id="ocr-%E5%8E%9F%E6%96%87%E5%AE%A1%E9%98%85-063%E7%84%A1%E8%A6%96%E5%8F%8B%E5%A5%BD">OCR 原文审阅 063｜無視友好</h2>
<div class="ocr-grid"><div class="ocr-meta"><h3>基础教学 / Raw OCR</h3><p>块号：063</p><p>源文件行：621-644</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">無視友好
<p>這是一種身份特性。擁有該特性的角色可 以拒絕主人公使用友好能力的要求。</p>
<p>&lt;u&gt;必定無視友好&lt;/u&gt;</p>
<p>這是一種身份特性。擁有該能力的角色必 須拒絕主人公使用友好能力的要求。必定無視 友好屬於無視友好的一種。 不死</p>
<p>這是一種身份特性。擁有該能力的角色不會死亡。</p>
<p>【強制】</p>
<p>在此關鍵字之後所描述的能力,一旦滿足條件必須進行結算。當有多個【強制】能力需在同一時點結算,則必須優先同時結算完所有的【強制】能力,隨後才能結算【任意】能力。</p>
<p>【任意】</p>
<p>在此關鍵字之後所描述的能力,如果滿足條件,劇作家就能夠自行決定是否結算該能力。 注意,只有在結算完所有【強制】能力後,才 允許結算【任意】能力。</p>
<p>如果多個【任意】能力可以同時結算時, 劇作家可按照自己決定的順序依次結算。</p>
<p>例1: 當某一區域中僅有被放置 4 枚密謀 指示物的殺手和殺人狂時,由於必須優先結算 殺人狂的能力,因此無法使用殺手的能力(因 為殺手已經死亡)。</p>
<p>例 2: 當關鍵人物和心上人同時死亡時, 由於輪迴結束和放置不安指示物兩個【強制】 能力同時結算,因此主人公可以目睹求愛者被 放置不安指示物。</pre></div></p>
</section>

<p>First Steps 是為了讓初學者們適應整個游 戲而設計的慘劇模組。如果主人公和劇作家均 為初次遊戲、或者缺乏足夠遊戲經驗的時候, 就用這套模組吧。</p>
<p>建議版圖上設置 6-7 位角色, 每輪輪迴時 長設為 3-6 天。</p>
<p>本模組中有兩條規則會有變化。這些變化 的目的是下調遊戲難度,更易於新玩家適應。</pre></div></p>

<p>規則 Y 的存在極為重要。劇作家會盡力創造懸念,留出不確定的空間。而主人公則需要對於這些懸念逐一排除,直達劇本的核心。</pre></div></p>

<div class="ocr-grid"><div class="ocr-meta"><h3>新手剧本 / Raw OCR</h3><p>块号：002</p><p>源文件行：7-12</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">## 劇本特徵
<p>『初學者劇本』是面向剛完成規則導入,準備初次開始遊戲的玩家們所創作的劇本。劇本建立在雙方玩家均初次接觸慘劇輪迴的前提之上,初學者也可以放心遊玩。</p>
<p>因為是練習用的劇本,整體難度很低,劇作家要獲得勝利並不容易。但這份劇本的初衷是讓 大家熟悉各種機制,為了更好地理解遊戲,首先 從這個劇本入手吧。</pre></div></p>
</section>

<div class="ocr-grid"><div class="ocr-meta"><h3>新手剧本 / Raw OCR</h3><p>块号：003</p><p>源文件行：13-18</p><p>未检测到页码锚点</p><p>此页保留 raw OCR 形态，用于直接找错字、乱码、重复段和表格识别问题。</p></div><pre class="ocr-text">## 故事
<p>歡迎遊玩初學者劇本。首先通過這個簡單的 慘劇來測試各位的實力吧。這場慘劇的構造非常 簡單。</p>
<p>有一位少女無意間獲知了一個秘密。為了不讓秘密再次外洩,組織派出了一位暗殺者打算滅口。城市裡還有位獵奇殺人狂在遊蕩,少女的偶像朋友又是個非常想當然的笨蛋…總之情況不妙。 主人公能夠成功保護好這位少女嗎?</pre></div></p>
</section>

<p>你的目標是殺死女學生。至於殺害方法,可以參考下面的劇作家勝利條件。給女學生放置 牌這件事本身就能引出許多猜測,所以一定要每 天在女學生身上設置行動卡。</p>
<p>第1輪輪迴中,主人公還不知道接下來會發生什麼。利用移動卡牌滿足殺人狂的殺害條件吧。</p>
<p>第2輪輪迴中,主人公會防備殺人狂。利用這個條件,我們來嘗試讓女學生自殺吧。利用假謠人的能力和「不安+1」,設法在第三天之前積攢到3枚不安指示物吧。</p>
<p>第3輪軸迴中,我們就來嘗試剩下的殺害到 段吧。可以給女學生2枚密謀指示物,讓她被關 員殺害;也可以給職員4枚密謀指示物。別忘了 有效利用好主謀的能力。不過需留意,職員無 進入學校。</p>
<p>為了初次擔任劇作家的玩家,我們在 20-2 頁準備了詳盡的遊戲嚮導。有它的幫助,遊戲 該會推進得更順利。</pre></div></p>

<p>首先請按照如下所示行動。</p>
<p>女學生:移動↑↓ 職員:密謀+1 醫生:不安+1</p>

<p>若未滿足上述條件→通往②</p>
<p>[图片占位: _page_2_Picture_9.jpeg]</p>
<p>如果偶像和女學生在同一區域,給女學生放置1枚不安指示物。</p>
<p>如果醫生和職員在同一區域,給職員放置1枚密謀指示物。如果未滿足,</p>
<p>且醫生和女學生在同一區域,則給女學生放置1枚密謀指示物。</p>
<p>看一眼 BE (壞結局)清單,如果滿足其中某個條件→進入對應的 BE</p>

<p>反之則→通往③</pre></div></p>

<p>根據當前盤面情況,我們可以採取不同的方針。越靠前的方針優先度越高。如果可以同時將多個方針組合起來,務必加以嘗試。</p>
<p>方針 1: 讓殺人狂殺害女學生(条件: 殺人狂沒有暴露)</p>
<p>設法讓巫女和女學生兩人獨處</p>
<p>(即使殺人狂已經暴露,如果行有餘力,或者已經沒有其它手段時也可以嘗試)</p>
<p>方針 2: 讓女學生自殺 (条件: 第2天女學生有1枚或以上的不安指示物,</p>
<p>第3天女學生有2枚或以上的不安指示物)</p>
<p>女學生: 不安+1 偶像: 往女學生所在區域移動 男學生: 禁止友好</p>
<p>方針 3: 讓殺手殺死主人公(条件: 第3天職員有1枚或以上密謀指示物)</p>
<p>職員:密謀十1或者密謀十2 醫生:往職員所在區域移動</p>
<p>方針 4: 讓殺手殺死女學生</p>
<p>女學生:密謀+1、密謀+2、往職員所在區域移動</p>
<p>職員: 往女學生所在區域移動(注意其無法進入學校)</pre></div></p>
